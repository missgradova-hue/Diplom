services:
  mysql:
    image: mysql:8.0
    container_name: diploma-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: pass

  postgres:
    image: postgres:16
    container_name: diploma-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass

  gate-simulator:
    image: node:18-alpine
    container_name: diploma-gate-simulator
    working_dir: /app
    volumes:
      - ./gate-simulator:/app
    ports:
      - "9999:9999"
    command: sh -c "npm install && npm start"